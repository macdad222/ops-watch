services:
  ops-watch:
    build: .
    container_name: ops-watch
    restart: always
    ports:
      - "15140:15140/udp"
    environment:
      # Direct container-to-container via the shared loki_default network — the
      # host-IP hairpin path stalls on large responses (30-min fortigate chunk = 15s+ timeout).
      - LOKI_URL=${LOKI_URL:-http://vllm-loki:3100}
      - CYCLE_SEC=${CYCLE_SEC:-300}
      # Loki tap runs in-container against Loki on this host (~/monitoring/loki).
      # NEVER re-enable the {job=~".+"} regex query — it hangs on this Loki build; loki-tail queries per-job.
      - LOKI_TAIL_ENABLED=${LOKI_TAIL_ENABLED:-1}
      - OPSWATCH_BIND=0.0.0.0:15140
      - OPSWATCH_OUT=data/events.jsonl
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./secrets/tg.cred:/app/secrets/tg.cred:ro
      - ./config/gates.json:/app/jev/gates.json:ro
      - ./config/ts-lane-id.txt:/app/jev/ts-lane-id.txt:ro
      - ./config/model-pin.txt:/app/jev/model-pin.txt:ro
      - ./data/jev-decisions.log:/app/jev/decisions.log
    networks:
      - default
      - loki

networks:
  default:
  loki:
    external: true
    name: loki_default
